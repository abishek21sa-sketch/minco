[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minco-healthcare-decision-intelligence"
version = "0.8.0a4"
description = "Healthcare operations decision-intelligence research platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "joblib>=1.4,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40,<1"]
phase2 = [
  "duckdb>=1.2,<2",
  "polars>=1.17,<2",
  "grpcio>=1.70,<2",
  "protobuf>=5,<7",
]
analytics = [
  "matplotlib>=3.8,<4",
]
dashboard = ["streamlit>=1.40,<2"]
solver = ["gurobipy>=11,<14"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
full = [
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.40,<2",
  "gurobipy>=11,<14",
  "duckdb>=1.2,<2",
  "polars>=1.17,<2",
  "grpcio>=1.70,<2",
  "protobuf>=5,<7",
  "anthropic>=0.40,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["results", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.vercel]
entrypoint = "MINCO.scripts.product_runtime:Handler"
