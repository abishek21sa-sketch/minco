services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MINCO_CORS_ORIGINS: http://localhost:8501
      MINCO_API_KEY: ${MINCO_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
